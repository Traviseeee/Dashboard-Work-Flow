<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Test</title>
    <style>
        :root {
            --bg-image: none;
            --primary: #6366f1;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: var(--bg-main, #f8fafc);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: var(--bg-image), rgba(6, 20, 38, 0.40);
            background-position: center;
            background-size: cover;
            z-index: -1;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
            z-index: -1;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .preference-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .preference-info h4 {
            margin: 0 0 4px 0;
            font-size: 14px;
            font-weight: 600;
        }

        .preference-info p {
            margin: 0;
            font-size: 12px;
            color: #64748b;
        }

        select {
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
        }

        #customBackgroundUpload {
            display: none;
            margin-top: 12px;
        }

        input[type="file"] {
            padding: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Background Image Test</h2>
        <div class="preference-item">
            <div class="preference-info">
                <h4>Background Image</h4>
                <p>Choose a background image for the glassmorphism effect</p>
            </div>
            <select id="backgroundImageInput" onchange="updateBackgroundImage(this.value)">
                <option value="none">No Background</option>
                <option value="nature1">Nature - Mountains</option>
                <option value="nature2">Nature - Forest</option>
                <option value="nature3">Nature - Ocean</option>
                <option value="abstract1">Abstract - Geometric</option>
                <option value="abstract2">Abstract - Minimal</option>
                <option value="city1">City - Urban</option>
                <option value="city2">City - Night</option>
                <option value="custom">Custom Upload</option>
            </select>
        </div>
        <div class="preference-item" id="customBackgroundUpload">
            <div class="preference-info">
                <h4>Custom Background</h4>
                <p>Upload your own background image</p>
            </div>
            <input type="file" id="backgroundUploadInput" accept="image/*" onchange="handleBackgroundUpload(this)">
        </div>
    </div>

    <script>
        function updateBackgroundImage(value) {
            const customUpload = document.getElementById('customBackgroundUpload');
            customUpload.style.display = value === 'custom' ? 'flex' : 'none';

            if (value === 'none') {
                document.body.style.setProperty('--bg-image', 'none');
            } else if (value === 'custom') {
                // Will be set when file is uploaded
            } else {
                const imageUrls = {
                    'nature1': 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&h=1080&fit=crop',
                    'nature2': 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1920&h=1080&fit=crop',
                    'nature3': 'https://images.unsplash.com/photo-1505142468610-359e7d316be0?w=1920&h=1080&fit=crop',
                    'abstract1': 'https://images.unsplash.com/photo-1557804506-669a67965ba0?w=1920&h=1080&fit=crop',
                    'abstract2': 'https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=1920&h=1080&fit=crop',
                    'city1': 'https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=1920&h=1080&fit=crop',
                    'city2': 'https://images.unsplash.com/photo-1514565131-fce0801e5785?w=1920&h=1080&fit=crop'
                };
                document.body.style.setProperty('--bg-image', `url(${imageUrls[value]})`);
            }
        }

        function handleBackgroundUpload(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.body.style.setProperty('--bg-image', `url(${e.target.result})`);
                };
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
