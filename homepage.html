<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Home</title>
<link rel="icon" id="favicon" href="assets/images/tra.jpg" type="image/x-icon">
<link href="https://cdn.jsdelivr.net/gh/fontsource/fontsource@main/css/inter.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="styles/Untitled-1.css">
<style>
:root {
    --bg-image: none;
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --sidebar-bg: #0f172a;
    --bg-main: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --sidebar-text: #94a3b8;
    --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04);
    --hover-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    --glass-bg: rgba(255, 255, 255, 0.7);
    --glass-border: rgba(255, 255, 255, 0.4);
}

[data-theme='dark'] {
    --bg-main: #0f172a;
    --bg-page: #0f172a;
    --card-bg: #1e293b;
    --bg-card: #1e293b;
    --glass-bg: rgba(30, 41, 59, 0.7);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --border-color: #334155;
    --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    transition: all 0.2s ease;
}

body {
    font-family: 'Inter', 'Kantumruy Pro', sans-serif;
    color: var(--text-main);
    font-size: 13px;
    line-height: 1.5;
    position: relative;
    overflow-x: hidden;
    background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&ixlib=rb-1.2.1&auto=format&fit=crop&w=1124&q=100');
    background-position: center;
    background-size: cover;
    min-height: 100vh;
    animation: fade-in 0.5s ease-in-out;
}

@keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
}

body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--bg-image), rgba(6, 20, 38, 0.40);
    background-position: center;
    background-size: cover;
    z-index: -1;
}

body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
    z-index: -1;
}

.homepage-container {
    min-height: 100vh;
    padding: 24px 32px;
    max-width: 1250px;
    margin: 0 auto;
    opacity: 1;
    transition: opacity 0.4s ease;
    background-color: rgba(0, 21, 60, 0.75);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.125);
    box-shadow: 0 30px 80px rgba(15, 23, 42, 0.14);
}

[data-theme='dark'] .homepage-container {
    background: rgba(15, 23, 42, 0.75);
    border-color: rgba(255, 255, 255, 0.08);
}

/* Header Section */
.homepage-header {
    margin-bottom: 40px;
    padding: 30px;
    text-align: center;
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
    animation: header-float 4s ease-in-out infinite;
}

@keyframes header-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

.greeting {
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 12px;
    color: var(--text-main);
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.datetime {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 500;
}

/* App Grid */
.apps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 28px;
    max-width: 800px;
    margin: 0 auto 40px;
    padding: 40px 20px;
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
}

@media (max-width: 600px) {
    .apps-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        padding: 20px;
    }
}

@media (min-width: 601px) and (max-width: 1024px) {
    .apps-grid {
        grid-template-columns: repeat(5, 1fr);
        gap: 20px;
    }
}

/* App Icon Card */
.app-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px 16px;
    border-radius: 16px;
    background-color: var(--card-bg);
    box-shadow: var(--card-shadow);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    text-decoration: none;
    color: var(--text-main);
    border: 1px solid var(--border-color);
    position: relative;
    overflow: hidden;
}

.app-card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: rotate(45deg);
    animation: card-shimmer 3s infinite;
}

@keyframes card-shimmer {
    0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
    100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
}

.app-card:hover {
    transform: translateY(-12px) scale(1.05);
    box-shadow: var(--hover-shadow);
    border-color: var(--primary);
    background: linear-gradient(135deg, var(--card-bg) 0%, rgba(99, 102, 241, 0.05) 100%);
}

[data-theme='dark'] .app-card:hover {
    background: linear-gradient(135deg, var(--card-bg) 0%, rgba(99, 102, 241, 0.1) 100%);
}

.app-icon {
    width: 70px;
    height: 70px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: white;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
}

.app-card:hover .app-icon {
    transform: scale(1.15) rotate(-5deg);
    box-shadow: 0 12px 30px rgba(99, 102, 241, 0.5);
}

.app-label {
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    word-break: break-word;
    color: var(--text-main);
    letter-spacing: -0.3px;
    position: relative;
    z-index: 1;
}

/* Color variants for different apps */
.app-card[data-color="blue"] .app-icon {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    animation: color-pulse-blue 3s ease-in-out infinite;
}

@keyframes color-pulse-blue {
    0%, 100% { box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }
    50% { box-shadow: 0 0 25px rgba(59, 130, 246, 0.7); }
}

.app-card[data-color="purple"] .app-icon {
    background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
    animation: color-pulse-purple 3s ease-in-out infinite;
}

@keyframes color-pulse-purple {
    0%, 100% { box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }
    50% { box-shadow: 0 0 25px rgba(168, 85, 247, 0.7); }
}

.app-card[data-color="pink"] .app-icon {
    background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
    animation: color-pulse-pink 3s ease-in-out infinite;
}

@keyframes color-pulse-pink {
    0%, 100% { box-shadow: 0 0 10px rgba(236, 72, 153, 0.4); }
    50% { box-shadow: 0 0 25px rgba(236, 72, 153, 0.7); }
}

.app-card[data-color="green"] .app-icon {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    animation: color-pulse-green 3s ease-in-out infinite;
}

@keyframes color-pulse-green {
    0%, 100% { box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
    50% { box-shadow: 0 0 25px rgba(16, 185, 129, 0.7); }
}

.app-card[data-color="orange"] .app-icon {
    background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
    animation: color-pulse-orange 3s ease-in-out infinite;
}

@keyframes color-pulse-orange {
    0%, 100% { box-shadow: 0 0 10px rgba(249, 115, 22, 0.4); }
    50% { box-shadow: 0 0 25px rgba(249, 115, 22, 0.7); }
}

.app-card[data-color="red"] .app-icon {
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    animation: color-pulse-red 3s ease-in-out infinite;
}

@keyframes color-pulse-red {
    0%, 100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
    50% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.7); }
}

.app-card[data-color="cyan"] .app-icon {
    background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
    animation: color-pulse-cyan 3s ease-in-out infinite;
}

@keyframes color-pulse-cyan {
    0%, 100% { box-shadow: 0 0 10px rgba(6, 182, 212, 0.4); }
    50% { box-shadow: 0 0 25px rgba(6, 182, 212, 0.7); }
}

.app-card[data-color="indigo"] .app-icon {
    background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    animation: color-pulse-indigo 3s ease-in-out infinite;
}

@keyframes color-pulse-indigo {
    0%, 100% { box-shadow: 0 0 10px rgba(99, 102, 241, 0.4); }
    50% { box-shadow: 0 0 25px rgba(99, 102, 241, 0.7); }
}

/* Quick Stats Section */
.quick-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 20px;
    margin-top: 40px;
    padding: 30px;
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
}

.stat-card {
    padding: 24px;
    border-radius: 16px;
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    box-shadow: var(--card-shadow);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
}

.stat-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 0%, rgba(99, 102, 241, 0.05) 50%, transparent 100%);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
}

.stat-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--hover-shadow);
    border-color: var(--primary);
}

.stat-card:hover::before {
    opacity: 1;
}

.stat-value {
    font-size: 32px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
}

.stat-label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* Settings & Theme Toggle */
.homepage-footer {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 40px;
    padding: 30px;
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
    flex-wrap: wrap;
}

.footer-btn {
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    padding: 12px 24px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 8px;
}

.footer-btn:hover {
    background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
    color: white;
    border-color: var(--primary);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
}

.footer-btn i {
    transition: all 0.3s ease;
}

.footer-btn:hover i {
    animation: icon-bounce 0.6s ease-in-out;
}

@keyframes icon-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
}

@media (max-width: 600px) {
    .homepage-container {
        padding: 20px;
        border-radius: 20px;
    }

    .homepage-header {
        margin-bottom: 30px;
        padding: 20px;
    }

    .greeting {
        font-size: 24px;
    }

    .apps-grid {
        gap: 12px;
        padding: 20px;
    }

    .quick-stats {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 20px;
    }

    .homepage-footer {
        flex-direction: column;
        gap: 12px;
        padding: 20px;
    }

    .footer-btn {
        width: 100%;
        justify-content: center;
        padding: 14px;
    }
}
</style>
</head>
<body>

<div class="homepage-container">
    <!-- Header -->
    <div class="homepage-header">
        <div class="greeting" id="greeting">Good Morning! 👋</div>
        <div class="datetime" id="datetime"></div>
    </div>

    <!-- Apps Grid -->
    <div class="apps-grid">
        <!-- Dashboard -->
        <a href="index.html" class="app-card" data-color="blue">
            <div class="app-icon">
                <i class="fas fa-chart-line"></i>
            </div>
            <div class="app-label">Dashboard</div>
        </a>

        <!-- Reports -->
        <a href="#reports" class="app-card" data-color="purple">
            <div class="app-icon">
                <i class="fas fa-file-alt"></i>
            </div>
            <div class="app-label">Reports</div>
        </a>

        <!-- Analytics -->
        <a href="#analytics" class="app-card" data-color="pink">
            <div class="app-icon">
                <i class="fas fa-chart-bar"></i>
            </div>
            <div class="app-label">Analytics</div>
        </a>

        <!-- Tasks -->
        <a href="#tasks" class="app-card" data-color="green">
            <div class="app-icon">
                <i class="fas fa-tasks"></i>
            </div>
            <div class="app-label">Tasks</div>
        </a>

        <!-- Data -->
        <a href="#data" class="app-card" data-color="orange">
            <div class="app-icon">
                <i class="fas fa-database"></i>
            </div>
            <div class="app-label">Data</div>
        </a>

        <!-- Settings -->
        <a href="#settings" class="app-card" data-color="cyan">
            <div class="app-icon">
                <i class="fas fa-cog"></i>
            </div>
            <div class="app-label">Settings</div>
        </a>

        <!-- Help -->
        <a href="#help" class="app-card" data-color="indigo">
            <div class="app-icon">
                <i class="fas fa-question-circle"></i>
            </div>
            <div class="app-label">Help</div>
        </a>

        <!-- Users -->
        <a href="#users" class="app-card" data-color="red">
            <div class="app-icon">
                <i class="fas fa-users"></i>
            </div>
            <div class="app-label">Users</div>
        </a>
    </div>

    <!-- Quick Stats -->
    <div class="quick-stats">
        <div class="stat-card">
            <div class="stat-value" id="stat-reports">0</div>
            <div class="stat-label">Reports</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-tasks">0</div>
            <div class="stat-label">Tasks</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-users">0</div>
            <div class="stat-label">Users</div>
        </div>
    </div>
</div>

<!-- Footer -->
<div class="homepage-footer">
    <button class="footer-btn" onclick="toggleTheme()">
        <i class="fas fa-moon"></i>
        <span>Theme</span>
    </button>
    <button class="footer-btn" onclick="goToMainApp()">
        <i class="fas fa-arrow-right"></i>
        <span>Go to Dashboard</span>
    </button>
</div>

<script>
// Update greeting based on time of day
function updateGreeting() {
    const hour = new Date().getHours();
    let greeting = '';
    
    if (hour < 12) {
        greeting = 'Good Morning! 👋';
    } else if (hour < 18) {
        greeting = 'Good Afternoon! 👋';
    } else {
        greeting = 'Good Evening! 👋';
    }
    
    document.getElementById('greeting').textContent = greeting;
}

// Update datetime
function updateDateTime() {
    const options = { 
        weekday: 'long', 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
    };
    const now = new Date().toLocaleDateString('en-US', options);
    document.getElementById('datetime').textContent = now;
}

// Theme toggle
function toggleTheme() {
    const html = document.documentElement;
    const currentTheme = html.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
}

// Navigate to main dashboard
function goToMainApp() {
    const container = document.querySelector('.homepage-container');
    if (container) {
        container.style.opacity = '0';
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 300);
    } else {
        window.location.href = 'index.html';
    }
}

// Load theme preference
function loadTheme() {
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    loadTheme();
    updateGreeting();
    updateDateTime();
    
    // Update datetime every minute
    setInterval(updateDateTime, 60000);
});

// Handle app card clicks (add navigation logic)
document.querySelectorAll('.app-card').forEach(card => {
    card.addEventListener('click', function(e) {
        const href = this.getAttribute('href');
        if (href && !href.startsWith('#')) {
            // Navigate to external pages
        } else {
            // Handle internal navigation
            console.log('App clicked:', this.querySelector('.app-label').textContent);
        }
    });
});
</script>

</body>
</html>
